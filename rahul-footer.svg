<text x="48" y="48" fill="#E5B5C7" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">OPEN TO COLLABORATION</text>
<text x="48" y="83" fill="#F8F0F3" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Let's build something amazing together.</text>
<text x="48" y="108" fill="#D7C4CC" font-family="Segoe UI,Arial,sans-serif" font-size="14">Have an idea, project, or opportunity? Let's connect and make it real.</text>
