<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
<title id="t">Let's build something amazing together</title><desc id="d">A cinematic burgundy mountain lake at dusk, glowing rose moon, pine silhouettes, bridge, and a collaboration invitation.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#190B12"/><stop offset=".55" stop-color="#451126"/><stop offset="1" stop-color="#10070C"/></linearGradient>
