 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#701A3D" stop-opacity="0"/><stop offset=".5" stop-color="#FF4F91"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
