<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Keep building</title>
  <defs>
    <linearGradient id="footer-line-rahul" x1="0" x2="1">
      <stop offset="0" stop-color="#451126" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 35 H1200" stroke="url(#footer-line-rahul)" stroke-width="1.5"/>
  <circle cx="600" cy="35" r="4" fill="#C77B9B">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="68" text-anchor="middle" fill="#C77B9B" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3">BUILD • LEARN • SHIP</text>
</svg>
