<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Rahul Rai — Full Stack Developer</title>
<desc id="d">A modern cinematic burgundy developer banner with code panels, a subtle grid, mountain-like abstract shapes, and glowing rose accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F0F3"/><stop offset=".55" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
 <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#701A3D" stop-opacity="0"/><stop offset=".5" stop-color="#C77B9B" stop-opacity=".24"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E5B5C7" stroke-opacity=".075"/></pattern>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect width="1200" height="360" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/>
 <circle cx="940" cy="125" r="178" fill="none" stroke="#C77B9B" stroke-opacity=".17"/><circle cx="940" cy="125" r="132" fill="none" stroke="#E5B5C7" stroke-opacity=".18" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0 940 125" to="360 940 125" dur="75s" repeatCount="indefinite"/></circle>
 <path d="M565 290 L690 155 L755 220 L850 110 L1000 275 L1100 185 L1200 280 V360 H565Z" fill="#451126" opacity=".75"/>
 <path d="M610 300 L730 190 L790 240 L875 145 L1000 290 L1100 220 L1200 300" fill="none" stroke="#C77B9B" stroke-opacity=".38"/>
 <g opacity=".9">
  <rect x="700" y="72" width="150" height="94" rx="7" fill="#10070C" stroke="#C77B9B" stroke-opacity=".65"/>
  <rect x="710" y="83" width="130" height="10" rx="2" fill="#451126"/>
  <path d="M713 108h44m-44 12h75m-75 12h56m-56 12h89" stroke="#C77B9B" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <rect x="868" y="52" width="165" height="108" rx="7" fill="#10070C" stroke="#C77B9B" stroke-opacity=".7"/>
  <rect x="878" y="63" width="145" height="10" rx="2" fill="#451126"/>
  <path d="M881 89h53m-53 12h100m-100 12h68m-68 12h88m-88 12h43" stroke="#E5B5C7" stroke-width="3" stroke-linecap="round" opacity=".8"/>
 </g>
 <rect x="-350" y="0" width="350" height="360" fill="url(#shine)"><animate attributeName="x" values="-350;1250;-350" dur="12s" repeatCount="indefinite"/></rect>
 <text x="64" y="66" fill="#E5B5C7" font-family="Consolas,monospace" font-size="13" letter-spacing="2">developer@rahul:~$</text>
 <text x="64" y="91" fill="#C77B9B" font-family="Consolas,monospace" font-size="13">Building ideas into reality...</text>
 <text x="60" y="153" fill="#E5B5C7" font-family="Georgia,serif" font-size="31" font-style="italic">Hi, I'm</text>
 <text x="56" y="220" fill="#F8F0F3" font-family="Segoe UI,Arial,sans-serif" font-size="69" font-weight="800" letter-spacing="-2">RAHUL <tspan fill="#C77B9B">RAI</tspan></text>
 <text x="64" y="253" fill="#F8F0F3" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Full Stack Developer  |  Laravel  |  MERN Stack Learner</text>
 <text x="64" y="283" fill="#D7C4CC" font-family="Segoe UI,Arial,sans-serif" font-size="15">Building scalable web apps with clean architecture and modern technology.</text>
 <rect x="64" y="307" width="175" height="34" rx="17" fill="url(#pink)"/>
 <text x="151" y="329" text-anchor="middle" fill="#190B12" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">VIEW PORTFOLIO  ↗</text>
 <path d="M64 350 H1135" stroke="#C77B9B" stroke-opacity=".55"/><circle cx="1135" cy="350" r="4" fill="#E5B5C7" filter="url(#glow)"/>
 <text x="1080" y="205" text-anchor="middle" fill="#E5B5C7" font-family="Georgia,serif" font-size="20" font-style="italic" transform="rotate(-8 1080 205)">Code</text>
 <text x="1080" y="231" text-anchor="middle" fill="#E5B5C7" font-family="Georgia,serif" font-size="20" font-style="italic" transform="rotate(-8 1080 231)">Create</text>
 <text x="1080" y="257" text-anchor="middle" fill="#E5B5C7" font-family="Georgia,serif" font-size="20" font-style="italic" transform="rotate(-8 1080 257)">Repeat</text>
</g></svg>